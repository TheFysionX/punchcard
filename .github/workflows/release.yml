name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'TheFysionX/punchcard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v6
      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use a trusted-publishing capable npm CLI
        run: npm install --global npm@latest
      - name: Verify release tag and package version
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Release tag must equal v'+p.version)"
      - name: Install without product lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Publish with provenance
        run: npm publish --access public --provenance
