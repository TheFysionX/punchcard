name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'TheFysionX/punchcard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v6
      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag and package version
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Release tag must equal v'+p.version)"
      - name: Check whether this version is already on npm
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import metadata from './package.json' with { type: 'json' };
          const spec = `${metadata.name}@${metadata.version}`;
          const url = `https://registry.npmjs.org/${encodeURIComponent(metadata.name)}/${encodeURIComponent(metadata.version)}`;
          const response = await fetch(url);
          if (response.status !== 404 && !response.ok) throw new Error(`npm registry returned ${response.status}`);
          const shouldPublish = response.status === 404;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${shouldPublish}\n`);
          console.log(shouldPublish ? `${spec} is available.` : `${spec} is already published; this release is an idempotent no-op.`);
          NODE
      - name: Install without product lifecycle scripts
        if: steps.registry.outputs.publish == 'true'
        run: npm ci --ignore-scripts
      - name: Publish with provenance
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --access public --provenance
